name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agendly_test
          POSTGRES_USER: agendly
          POSTGRES_PASSWORD: agendly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Reporte de vulnerabilidades de deps de producción (OWASP A06). Advisory:
      # la mayoría de los hallazgos actuales son del toolchain de Nuxt/devtools
      # (transitivas, dev-only, fuera del runtime buildeado). Triar y accionar las
      # que estén en el runtime. No bloquea el build para no frenar merges por
      # advisories no accionables de dependencias transitivas.
      - name: Audit dependencies (advisory)
        run: pnpm audit --prod --audit-level=high || true

      - name: Generate Prisma client
        run: pnpm --filter @agendly/backend exec prisma generate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://agendly:agendly_test@localhost:5432/agendly_test

      # Atrapa builds rotos antes de que Render/Netlify los descubran en deploy
      - name: Build
        run: pnpm build
