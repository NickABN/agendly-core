name: Account purge

# Daily: permanently deletes accounts whose 30-day deletion grace period ended
# (POST /account/purge/run). Same secrets as the Reminders workflow; the request
# also wakes Render's free instance, hence the generous timeout and retries.
on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Purge accounts past their deletion date
        env:
          API_URL: ${{ secrets.AGENDLY_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "AGENDLY_API_URL / CRON_SECRET not configured — skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 30 --retry-all-errors \
            -X POST "${API_URL%/}/account/purge/run" \
            -H "x-cron-secret: $CRON_SECRET"
