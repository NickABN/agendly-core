<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ticket-perforation {
            background-image: radial-gradient(circle at 10px 10px, transparent 10px, #ffffff 11px);
            background-size: 20px 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-secondary min-h-screen font-body text-on-surface flex flex-col items-center justify-center p-4">
<!-- Success Header State (Invisible TopAppBar equivalent for focus) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 py-6">
<div class="text-white text-xl font-bold tracking-tighter">Agendly</div>
<button class="bg-white/20 backdrop-blur-md p-2 rounded-full text-white hover:bg-white/30 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<main class="w-full max-w-md mt-12 mb-8 relative">
<!-- Success Animation & Title -->
<div class="text-center mb-10 flex flex-col items-center">
<div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-6 ring-8 ring-white/10">
<span class="material-symbols-outlined text-white !text-5xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="text-white font-headline text-3xl font-extrabold tracking-tight mb-2">¡Tu cita está confirmada!</h1>
<p class="text-secondary-fixed-dim font-medium">Hemos reservado tu espacio con éxito.</p>
</div>
<!-- The 'Ticket' Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_20px_40px_rgba(0,0,0,0.15)] overflow-hidden relative">
<!-- Ticket Top Section -->
<div class="p-8">
<div class="flex items-start justify-between mb-8">
<div class="space-y-1">
<label class="text-[11px] font-bold tracking-widest text-on-surface-variant uppercase">Servicio</label>
<p class="text-xl font-bold text-on-surface">Corte &amp; Estilo Premium</p>
</div>
<div class="w-16 h-16 rounded-full overflow-hidden border-2 border-surface-container">
<img alt="Professional barber" class="w-full h-full object-cover" data-alt="Portrait of a smiling professional barber in a modern minimalist hair salon with warm ambient lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAeCOMruGuFgDVJxoQElkmy8-wgoXrneCR4lM3G-wxLTHWvAEzZQN3WVfNvIdCqABvlADbx6TjRbW2sjXvdEHhnosBOzJop0tYXL6yvhKebVtGt8fqnbCk_o97O4gIdnOAtUds6TISrNA01Br_3ijWXEJ9aH9AI_Qvgr-yeq-9BxZApunBEXraKDd1Ho2p9o47Fz5LH6jmnBiyHd30legDcHbE5JhoBnCTeihKN1VZGwPMl1t5BjDTdcIxMkloAJqCn9Mxcdmh4bqU"/>
</div>
</div>
<div class="grid grid-cols-2 gap-y-6 gap-x-4">
<div class="space-y-1">
<label class="text-[11px] font-bold tracking-widest text-on-surface-variant uppercase flex items-center gap-1">
<span class="material-symbols-outlined !text-[14px]">group</span> Especialista
                        </label>
<p class="font-semibold text-on-surface">Alex Rivera</p>
</div>
<div class="space-y-1">
<label class="text-[11px] font-bold tracking-widest text-on-surface-variant uppercase flex items-center gap-1">
<span class="material-symbols-outlined !text-[14px]">event</span> Fecha
                        </label>
<p class="font-semibold text-on-surface">15 Octubre, 2024</p>
</div>
<div class="space-y-1">
<label class="text-[11px] font-bold tracking-widest text-on-surface-variant uppercase flex items-center gap-1">
<span class="material-symbols-outlined !text-[14px]">schedule</span> Hora
                        </label>
<p class="font-semibold text-on-surface">14:30 PM</p>
</div>
<div class="space-y-1">
<label class="text-[11px] font-bold tracking-widest text-on-surface-variant uppercase flex items-center gap-1">
<span class="material-symbols-outlined !text-[14px]">location_on</span> Lugar
                        </label>
<p class="font-semibold text-on-surface">Studio Central</p>
</div>
</div>
</div>
<!-- Ticket Divider (Perforation) -->
<div class="relative flex items-center px-4">
<div class="absolute -left-3 w-6 h-6 rounded-full bg-secondary"></div>
<div class="flex-grow border-t-2 border-dashed border-surface-container-high h-px mx-4"></div>
<div class="absolute -right-3 w-6 h-6 rounded-full bg-secondary"></div>
</div>
<!-- Ticket Bottom Section -->
<div class="p-8 bg-surface-container-low/30 space-y-4">
<button class="w-full bg-surface-container-high text-on-surface font-bold py-4 px-6 rounded-full flex items-center justify-center gap-2 hover:bg-surface-container-highest transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined">calendar_add_on</span>
                    Agregar al calendario
                </button>
<div class="flex items-center justify-between text-on-surface-variant pt-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined !text-[18px]">verified</span>
<span class="text-xs font-medium italic">Referencia: #AG-9921</span>
</div>
<button class="text-primary text-xs font-bold flex items-center gap-1 hover:underline">
                        Descargar PDF <span class="material-symbols-outlined !text-[16px]">download</span>
</button>
</div>
</div>
</div>
<!-- Footer Micro-copy -->
<footer class="mt-8 text-center space-y-6">
<p class="text-secondary-fixed font-medium text-sm">Listo. No necesitaste crear cuenta para esto</p>
<div class="inline-flex items-center gap-2 px-4 py-2 bg-black/10 backdrop-blur-sm rounded-full border border-white/10">
<span class="text-[10px] font-bold tracking-[0.2em] text-white/70 uppercase">Hecho con</span>
<span class="text-xs font-black text-white tracking-tighter">Agendly</span>
</div>
</footer>
</main>
<!-- Contextual FAB (Hidden as per suppression logic for success screen) -->
<!-- Nav Bars Suppressed for Success/Transactional Focus -->
</body></html>
