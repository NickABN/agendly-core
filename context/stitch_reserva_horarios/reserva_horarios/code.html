<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error-container": "#ffdad6",
                        "outline-variant": "#c0c7d4",
                        "on-surface": "#191c1d",
                        "tertiary-container": "#956e00",
                        "inverse-on-surface": "#f0f1f2",
                        "secondary": "#006c49",
                        "secondary-container": "#6cf8bb",
                        "surface-tint": "#005fad",
                        "error": "#ba1a1a",
                        "outline": "#717784",
                        "on-surface-variant": "#414752",
                        "tertiary": "#765700",
                        "primary-container": "#0076d3",
                        "on-secondary": "#ffffff",
                        "on-background": "#191c1d",
                        "tertiary-fixed": "#ffdf9f",
                        "primary": "#005da9",
                        "on-secondary-container": "#00714d",
                        "on-primary-fixed-variant": "#004884",
                        "primary-fixed-dim": "#a4c9ff",
                        "surface-container-low": "#f3f4f5",
                        "on-primary-container": "#fdfcff",
                        "inverse-primary": "#a4c9ff",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "background": "#f8f9fa",
                        "surface": "#f8f9fa",
                        "on-secondary-fixed": "#002113",
                        "on-tertiary-container": "#fffbff",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f8f9fa",
                        "secondary-fixed-dim": "#4edea3",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#6ffbbe",
                        "surface-variant": "#e1e3e4",
                        "primary-fixed": "#d4e3ff",
                        "on-secondary-fixed-variant": "#005236",
                        "on-primary-fixed": "#001c39",
                        "on-tertiary-fixed": "#261a00",
                        "surface-dim": "#d9dadb",
                        "tertiary-fixed-dim": "#f9bd22",
                        "inverse-surface": "#2e3132",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e1e3e4",
                        "surface-container": "#edeeef",
                        "surface-container-high": "#e7e8e9"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Main Booking Canvas -->
<main class="w-full max-w-lg mx-auto flex flex-col min-h-screen">
<!-- BusinessHeader -->
<header class="relative w-full overflow-hidden">
<div class="h-48 w-full bg-surface-container-highest">
<img alt="Salón Lupita" class="w-full h-full object-cover" data-alt="Modern high-end hair salon interior with soft natural lighting, minimalist furniture, and large mirrors in a clean bright space" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC4-JLWj7rdj4rp6SSv7VOKg0RcONVqEh1tUvUDIABpt4iM3k78-ASvRrkKONFIkJ9zw5XzmGA3DHeUUZ6Z-fh-x5LfCrM5nzvjhnB9aQATDk_CN15it1AzDuHY_PxWKH0a09QjzTh4uc_modB8QFDoNw_9Uia4nO9JP1j6N7zPZM-GrDNW9F13P-wc0ejgcp6vP82j1tqik0a6Rx87iiEscntSUO_4OzNYCPiTC6pLq5NJbPOl9aFN73ARNCu8u8xb2QWWNkNCjyg"/>
<div class="absolute inset-0 bg-gradient-to-t from-on-surface/60 to-transparent"></div>
</div>
<div class="absolute bottom-0 left-0 w-full p-6 text-white flex flex-col gap-2">
<div class="flex items-center gap-2">
<span class="bg-primary-container text-on-primary-container text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
                        Agenda sin crear cuenta
                    </span>
</div>
<h1 class="text-2xl font-extrabold tracking-tight headline">Salón Lupita · Narvarte</h1>
</div>
</header>
<!-- Progress Indicator (Simplified) -->
<div class="w-full bg-surface-container-low h-1.5 overflow-hidden">
<div class="bg-primary h-full w-1/2 rounded-r-full"></div>
</div>
<!-- Content Area -->
<section class="p-4 flex flex-col gap-6 -mt-2 z-10">
<!-- StepCard -->
<div class="bg-surface-container-lowest rounded-2xl shadow-sm p-6 flex flex-col gap-6">
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="text-on-surface-variant text-xs font-semibold uppercase tracking-widest label">Paso 2 de 4</span>
<h2 class="text-2xl font-bold text-on-surface headline">¿Cuándo?</h2>
</div>
<div class="bg-surface-container-high p-2 rounded-xl">
<span class="material-symbols-outlined text-primary">calendar_month</span>
</div>
</div>
<!-- Selector de día -->
<div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
<button class="flex-shrink-0 flex flex-col items-center justify-center w-16 h-20 rounded-2xl transition-all duration-200 bg-primary text-on-primary shadow-md">
<span class="text-[10px] uppercase font-bold tracking-tighter opacity-80">Hoy</span>
<span class="text-xl font-black">4</span>
</button>
<button class="flex-shrink-0 flex flex-col items-center justify-center w-16 h-20 rounded-2xl transition-all duration-200 bg-surface-container-low text-on-surface hover:bg-surface-container-high">
<span class="text-[10px] uppercase font-bold tracking-tighter text-on-surface-variant">Mié</span>
<span class="text-xl font-bold">5</span>
</button>
<button class="flex-shrink-0 flex flex-col items-center justify-center w-16 h-20 rounded-2xl transition-all duration-200 bg-surface-container-low text-on-surface hover:bg-surface-container-high">
<span class="text-[10px] uppercase font-bold tracking-tighter text-on-surface-variant">Jue</span>
<span class="text-xl font-bold">6</span>
</button>
<button class="flex-shrink-0 flex flex-col items-center justify-center w-16 h-20 rounded-2xl transition-all duration-200 bg-surface-container-low text-on-surface hover:bg-surface-container-high">
<span class="text-[10px] uppercase font-bold tracking-tighter text-on-surface-variant">Vie</span>
<span class="text-xl font-bold">7</span>
</button>
</div>
<!-- Urgency Message -->
<div class="bg-tertiary-fixed/30 border-l-4 border-tertiary px-4 py-3 rounded-r-lg flex items-center gap-3">
<span class="material-symbols-outlined text-tertiary text-sm">warning</span>
<p class="text-on-tertiary-fixed-variant text-sm font-medium">Quedan 2 horarios disponibles hoy</p>
</div>
<!-- SlotGrid -->
<div class="grid grid-cols-2 gap-3">
<!-- Ocupado -->
<button class="relative group h-12 flex items-center justify-center rounded-xl bg-surface-container text-outline opacity-50 cursor-not-allowed overflow-hidden" disabled="">
<span class="font-medium text-sm">09:00</span>
<div class="absolute inset-0 bg-stripe-pattern opacity-10"></div>
</button>
<!-- Disponible -->
<button class="h-12 flex items-center justify-center rounded-xl border-2 border-outline-variant hover:border-primary hover:bg-primary-container/5 transition-all duration-200 active:scale-95">
<span class="font-bold text-on-surface text-sm">09:30</span>
</button>
<!-- Disponible -->
<button class="h-12 flex items-center justify-center rounded-xl border-2 border-outline-variant hover:border-primary hover:bg-primary-container/5 transition-all duration-200 active:scale-95">
<span class="font-bold text-on-surface text-sm">10:00</span>
</button>
<!-- Seleccionado -->
<button class="h-12 flex items-center justify-center rounded-xl bg-primary text-on-primary shadow-lg shadow-primary/20 transition-all duration-200 ring-2 ring-primary ring-offset-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-bold text-sm">11:00</span>
</div>
</button>
<button class="h-12 flex items-center justify-center rounded-xl border-2 border-outline-variant hover:border-primary hover:bg-primary-container/5 transition-all duration-200 active:scale-95">
<span class="font-bold text-on-surface text-sm">11:30</span>
</button>
<button class="h-12 flex items-center justify-center rounded-xl border-2 border-outline-variant hover:border-primary hover:bg-primary-container/5 transition-all duration-200 active:scale-95">
<span class="font-bold text-on-surface text-sm">12:00</span>
</button>
</div>
<!-- Summary Row -->
<div class="pt-4 border-t border-surface-container-high mt-2">
<div class="flex justify-between items-center mb-6">
<div class="flex flex-col">
<span class="text-xs text-on-surface-variant font-medium">Servicio seleccionado</span>
<span class="text-sm font-bold text-on-surface">Corte y Peinado Profesional</span>
</div>
<span class="text-sm font-black text-primary">$450</span>
</div>
<button class="w-full bg-primary text-on-primary py-4 rounded-full font-bold shadow-lg hover:shadow-xl hover:bg-primary/90 transition-all duration-300 flex items-center justify-center gap-2 group">
                        Confirmar horario
                        <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<button class="w-full mt-3 py-2 text-on-surface-variant text-sm font-semibold hover:text-on-surface transition-colors">
                        Volver a servicios
                    </button>
</div>
</div>
</section>
<!-- Footer -->
<footer class="mt-auto py-8 flex flex-col items-center gap-4">
<div class="inline-flex items-center gap-2 px-4 py-2 bg-surface-container rounded-full hover:bg-surface-container-high transition-colors cursor-pointer border border-outline-variant/30">
<span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">Hecho con</span>
<span class="text-primary font-black tracking-tighter flex items-center gap-1">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">hexagon</span>
                    Agendly
                </span>
<span class="material-symbols-outlined text-xs text-on-surface-variant">arrow_forward</span>
</div>
<p class="text-[10px] text-on-surface-variant/60 font-medium">© 2024 Salón Lupita. Todos los derechos reservados.</p>
</footer>
</main>
<style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .bg-stripe-pattern {
            background-image: linear-gradient(45deg, #000 25%, transparent 25%, transparent 50%, #000 50%, #000 75%, transparent 75%, transparent);
            background-size: 10px 10px;
        }
    </style>
</body></html>
