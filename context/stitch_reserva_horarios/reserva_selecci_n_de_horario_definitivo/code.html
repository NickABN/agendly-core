<!DOCTYPE html>

<html lang="es-MX"><head>

              "surface-container-high": "#e7e8e9",
              "surface-tint": "#005fad",
              "on-primary-fixed-variant": "#004884",
              "secondary-fixed-dim": "#b9c8da",

              "primary-container": "#0076d3",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased">
<!-- Top Navigation Bar (Public View) -->
<nav class="flex items-center justify-between px-6 sticky top-0 z-40 bg-white/80 backdrop-blur-md w-full h-16 shadow-sm">
<div class="flex items-center gap-2">
<span class="text-lg font-bold text-slate-900">Agendly</span>
<span class="text-xs font-medium text-on-secondary-container bg-secondary-container px-2 py-0.5 rounded-full">Salón Calma</span>
</div>
<div class="flex items-center gap-4">
<button class="text-slate-400 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="help">help</span>
</button>
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container">
<img class="w-full h-full object-cover" data-alt="professional portrait of a salon manager with soft natural lighting and minimalist background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAlxICSGpjphDVbCb_7Q2A1Zv4dSxb6O1W-GEPf3Pj0EVsXTnK9s6T6aeeguXw-yeFRVWqid5fZ1UFkPYwRICNDIYvzgS8byKijkC8K7nbOiIEBMNZmv_WAk0pp-FhVadh-gB5tbngIp-vUBbz2AR3HK9k8b3RyehggUWX8M9RV4xq7VZtMXQPe-m8v8nBYQQLHxJJTa2dkb1aOM55Kfl6WBvtVvnOLt81L7mXyeDSxmJx3669Wzl8Dwn4nVRqhvrj7cwiqT1XhvaU"/>
</div>
</div>
</nav>
<main class="max-w-2xl mx-auto px-4 py-8 md:py-12">
<!-- Progress Stepper -->
<div class="flex items-center justify-center mb-8 gap-3">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center text-sm font-semibold">
<span class="material-symbols-outlined text-sm" data-icon="check">check</span>
</div>
<span class="text-xs font-semibold text-primary">Servicio</span>
</div>
<div class="w-12 h-px bg-primary"></div>
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center text-sm font-semibold">2</div>
<span class="text-xs font-semibold text-on-surface">Horario</span>
</div>
<div class="w-12 h-px bg-surface-container-highest"></div>
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-secondary-container flex items-center justify-center text-sm font-semibold">3</div>
<span class="text-xs font-semibold text-on-secondary-container opacity-50">Confirmar</span>
</div>
</div>
<!-- Header Section -->
<header class="mb-10 text-center">
<h1 class="text-3xl font-semibold tracking-tight text-on-surface mb-2">Selecciona tu horario</h1>
<p class="text-on-secondary-container font-medium">Corte de Cabello Signature &amp; Ritual de Barba</p>
</header>
<!-- Date Selector (Horizontal Tabs) -->
<section class="mb-8">
<div class="flex items-center justify-between mb-4 px-1">
<h2 class="text-sm font-bold uppercase tracking-wider text-on-secondary-container">Mayo 2024</h2>
<button class="text-primary font-semibold text-sm flex items-center gap-1 hover:underline">
                    Ver calendario <span class="material-symbols-outlined text-xs" data-icon="calendar_month">calendar_month</span>
</button>
</div>
<div class="flex gap-3 overflow-x-auto pb-4 hide-scrollbar snap-x">
<!-- Active Tab -->
<button class="flex-shrink-0 w-20 h-24 rounded-xl bg-primary text-on-primary flex flex-col items-center justify-center gap-1 shadow-sm snap-start transition-transform active:scale-95">
<span class="text-[10px] uppercase font-bold tracking-widest opacity-80">Hoy</span>
<span class="text-2xl font-bold">24</span>
<span class="text-xs font-medium">Vie</span>
</button>
<!-- Inactive Tab -->
<button class="flex-shrink-0 w-20 h-24 rounded-xl bg-surface-container-lowest text-on-surface flex flex-col items-center justify-center gap-1 snap-start transition-colors hover:bg-surface-container-low active:scale-95">
<span class="text-[10px] uppercase font-bold tracking-widest text-on-secondary-container">Mañana</span>
<span class="text-2xl font-bold">25</span>
<span class="text-xs font-medium text-on-secondary-container">Sáb</span>
</button>
<button class="flex-shrink-0 w-20 h-24 rounded-xl bg-surface-container-lowest text-on-surface flex flex-col items-center justify-center gap-1 snap-start transition-colors hover:bg-surface-container-low active:scale-95">
<span class="text-[10px] uppercase font-bold tracking-widest text-on-secondary-container">Lun</span>
<span class="text-2xl font-bold">27</span>
<span class="text-xs font-medium text-on-secondary-container">May</span>
</button>
<button class="flex-shrink-0 w-20 h-24 rounded-xl bg-surface-container-lowest text-on-surface flex flex-col items-center justify-center gap-1 snap-start transition-colors hover:bg-surface-container-low active:scale-95">
<span class="text-[10px] uppercase font-bold tracking-widest text-on-secondary-container">Mar</span>
<span class="text-2xl font-bold">28</span>
<span class="text-xs font-medium text-on-secondary-container">May</span>
</button>
<button class="flex-shrink-0 w-20 h-24 rounded-xl bg-surface-container-lowest text-on-surface flex flex-col items-center justify-center gap-1 snap-start transition-colors hover:bg-surface-container-low active:scale-95">
<span class="text-[10px] uppercase font-bold tracking-widest text-on-secondary-container">Mié</span>
<span class="text-2xl font-bold">29</span>
<span class="text-xs font-medium text-on-secondary-container">May</span>
</button>
</div>
</section>
<!-- Urgency Label -->
<div class="mb-6 flex items-center gap-3 bg-tertiary-container/10 p-4 rounded-xl">
<span class="material-symbols-outlined text-tertiary" data-icon="bolt">bolt</span>
<p class="text-sm font-semibold text-tertiary">Últimos 2 horarios disponibles hoy</p>
</div>
<!-- Slots Grid -->
<section class="grid grid-cols-2 gap-4 mb-12">
<!-- Available Slot -->
<button class="group relative bg-surface-container-lowest border-2 border-transparent hover:border-primary/20 p-6 rounded-xl flex flex-col items-center justify-center gap-2 transition-all duration-200 active:scale-95 shadow-sm">
<span class="text-xl font-bold text-on-surface group-hover:text-primary transition-colors">09:00 AM</span>
<span class="text-[10px] font-bold text-primary uppercase tracking-widest">Disponible</span>
</button>
<!-- Occupied Slot -->
<div class="relative bg-surface-container-high/40 p-6 rounded-xl flex flex-col items-center justify-center gap-2 cursor-not-allowed opacity-60">
<span class="text-xl font-bold text-on-secondary-container line-through">10:00 AM</span>
<span class="text-[10px] font-bold text-on-secondary-container uppercase tracking-widest">Ocupado</span>
</div>
<!-- Available Slot (Selected State Mockup) -->
<button class="group relative bg-primary-container text-on-primary-container p-6 rounded-xl flex flex-col items-center justify-center gap-2 transition-all duration-200 shadow-lg ring-4 ring-primary/10">
<span class="text-xl font-bold">11:30 AM</span>
<span class="text-[10px] font-bold uppercase tracking-widest opacity-90">Seleccionado</span>
<div class="absolute -top-2 -right-2 bg-primary text-on-primary rounded-full w-6 h-6 flex items-center justify-center">
<span class="material-symbols-outlined text-xs" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Available Slot -->
<button class="group relative bg-surface-container-lowest border-2 border-transparent hover:border-primary/20 p-6 rounded-xl flex flex-col items-center justify-center gap-2 transition-all duration-200 active:scale-95 shadow-sm">
<span class="text-xl font-bold text-on-surface group-hover:text-primary transition-colors">01:00 PM</span>
<span class="text-[10px] font-bold text-primary uppercase tracking-widest">Disponible</span>
</button>
<!-- Occupied Slot -->
<div class="relative bg-surface-container-high/40 p-6 rounded-xl flex flex-col items-center justify-center gap-2 cursor-not-allowed opacity-60">
<span class="text-xl font-bold text-on-secondary-container line-through">02:30 PM</span>
<span class="text-[10px] font-bold text-on-secondary-container uppercase tracking-widest">Ocupado</span>
</div>
<!-- Available Slot -->
<button class="group relative bg-surface-container-lowest border-2 border-transparent hover:border-primary/20 p-6 rounded-xl flex flex-col items-center justify-center gap-2 transition-all duration-200 active:scale-95 shadow-sm">
<span class="text-xl font-bold text-on-surface group-hover:text-primary transition-colors">04:00 PM</span>
<span class="text-[10px] font-bold text-primary uppercase tracking-widest">Disponible</span>
</button>
</section>
<!-- Footer Actions -->
<div class="flex flex-col gap-4">
<button class="w-full bg-primary text-on-primary font-bold py-5 rounded-xl text-lg shadow-md hover:bg-primary-container transition-colors flex items-center justify-center gap-2">
                Continuar al paso final
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full py-4 text-on-secondary-container font-semibold hover:text-on-surface transition-colors">
                Regresar a servicios
            </button>
</div>
</main>
<!-- Footer Information -->
<footer class="mt-20 flex flex-col items-center justify-center space-y-4 w-full py-12 bg-slate-50 border-t border-slate-100">
<span class="text-xs font-black uppercase text-slate-300 tracking-[0.2em]">Agendly</span>
<div class="flex gap-6">
<a class="font-inter text-xs tracking-widest text-slate-400 hover:text-blue-500 transition-colors" href="#">Privacidad</a>
<a class="font-inter text-xs tracking-widest text-slate-400 hover:text-blue-500 transition-colors" href="#">Términos</a>
<a class="font-inter text-xs tracking-widest text-slate-400 hover:text-blue-500 transition-colors" href="#">Soporte</a>
</div>
<p class="font-inter text-xs tracking-widest text-slate-400">© 2024 Agendly. Todos los derechos reservados.</p>
</footer>
</body></html>
