# Netlify config — deploys the Nuxt frontend (SSR) from the pnpm monorepo.
# Netlify runs from the repo root (where this file lives): it needs the whole
# workspace present because the frontend aliases @agendly/shared to its SOURCE
# (../shared/src). Netlify auto-installs with pnpm (detected via the root
# package.json "packageManager": "pnpm@10.32.1" + corepack).
#
# Nitro auto-detects the NETLIFY env var → emits the `netlify` preset (serverless
# SSR function + static assets in packages/frontend/dist). No nitro.preset needed
# in nuxt.config, so local Docker keeps building as node-server.

[build]
  command = "pnpm --filter @agendly/frontend build"
  publish = "packages/frontend/dist"

[build.environment]
  NODE_VERSION = "24"

# Production uses a same-origin Nitro proxy so host-only auth cookies survive SSR:
# NUXT_PUBLIC_API_URL=/api
# NUXT_API_PROXY_TARGET=https://agendly-backend-u9tt.onrender.com (private runtime config)
# NUXT_PUBLIC_APP_URL=https://agendly-admin1.netlify.app
# Do NOT set NUXT_API_URL_INTERNAL on Netlify; it is local-Docker-only.

# Cabeceras de seguridad para el frontend (OWASP A05). Netlify termina TLS.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
